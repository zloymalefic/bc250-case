<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BC-250 Case — 3D assembly</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="legend.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">BC-250 / JF13K · CORE v0.1</p>
        <h1>Интерактивная сборка корпуса</h1>
      </div>
      <div class="status"><span></span><strong id="status">Загрузка геометрии…</strong></div>
    </header>

    <section class="viewer" aria-label="Трёхмерная модель корпуса">
      <canvas id="scene"></canvas>
      <div class="view-actions">
        <button data-view="iso" class="active">3/4</button>
        <button data-view="front">Спереди</button>
        <button data-view="side">Сбоку</button>
        <button data-view="rear">Сзади</button>
      </div>
      <div id="hint">ЛКМ — вращение · колесо — масштаб · ПКМ — сдвиг</div>
      <div id="part-label" hidden></div>
    </section>

    <aside class="controls">
      <section>
        <h2>Сборка</h2>
        <label class="range-row"><span>Разнести детали <output id="explode-value">0%</output></span><input id="explode" type="range" min="0" max="100" value="0"></label>
        <label class="switch-row"><span>Автовращение</span><input id="rotate" type="checkbox"><i></i></label>
        <label class="switch-row"><span>Внутренние компоненты</span><input id="equipment" type="checkbox" checked><i></i></label>
        <label class="switch-row"><span>Каркас корпуса</span><input id="shell" type="checkbox" checked><i></i></label>
      </section>
      <section>
        <h2>Задняя крышка</h2>
        <div class="segmented">
          <button data-rear="vertical">Вертикальная</button>
          <button data-rear="horizontal" class="active">Горизонтальная</button>
          <button data-rear="none">Снять</button>
        </div>
      </section>
      <section class="legend">
        <h2>Состав</h2>
        <div id="component-legend"></div>
      </section>
      <p class="note">Геометрия корпуса выгружена из текущего OpenSCAD master. Модель имеет статус <strong>validation-only</strong> и не является релизом для печати.</p>
    </aside>
  </main>
<script type="module" src="viewer.js?v=20260820-esp32-inset"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#17191d}.sub{font:16px system-ui,sans-serif;fill:#626872}
      .label{font:700 21px system-ui,sans-serif;fill:#252930}.dim{font:14px system-ui,sans-serif;fill:#69717c}
      .body{fill:#20242a;stroke:#0b0d10;stroke-width:4}.panel{fill:#15181d;stroke:#414750;stroke-width:3}
      .edge{fill:none;stroke:#2580ff;stroke-width:4}.detail{fill:#080a0d;stroke:#737b86;stroke-width:2}
      .guide{fill:none;stroke:#a7adb6;stroke-width:1.5;stroke-dasharray:5 5}
    </style>
    <pattern id="hex" width="12" height="10" patternUnits="userSpaceOnUse">
      <path d="M3 1h6l3 4-3 4H3L0 5z" fill="none" stroke="#555d67" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="900" fill="#f5f6f7"/>
  <text class="title" x="55" y="55">BC-250 + JF13K — exterior concept v0.2</text>
  <text class="sub" x="55" y="84">Simple orthographic views · nominal enclosure 330 × 155 × 195 mm · horizontal configuration</text>

  <!-- Left side: visible service side; front is at the left. -->
  <g transform="translate(55 145)">
    <text class="label" x="275" y="-18" text-anchor="middle">LEFT</text>
    <path class="body" d="M0 22L22 0H528L550 22V303L528 325H22L0 303Z"/>
    <path d="M0 22L22 0H40V325H22L0 303Z" fill="#edb80e" stroke="#0b0d10" stroke-width="3"/>
    <path d="M510 0H528L550 22V303L528 325H510Z" fill="#d92c22" stroke="#0b0d10" stroke-width="3"/>
    <rect class="panel" x="47" y="45" width="456" height="235" rx="5"/>
    <path class="edge" d="M47 280H503"/>
    <g stroke="#060708" stroke-width="8" stroke-linecap="round">
      <path d="M405 192l30-9"/><path d="M405 214l30-9"/><path d="M405 236l30-9"/>
      <path d="M447 192l30-9"/><path d="M447 214l30-9"/><path d="M447 236l30-9"/>
    </g>
    <rect x="66" y="322" width="110" height="9" rx="3" fill="#090b0d"/>
    <rect x="374" y="322" width="110" height="9" rx="3" fill="#090b0d"/>
    <text class="dim" x="275" y="352" text-anchor="middle">330 × 195 mm</text>
  </g>

  <!-- Right side: clean opposite side; front is at the right. -->
  <g transform="translate(795 145)">
    <text class="label" x="275" y="-18" text-anchor="middle">RIGHT</text>
    <path class="body" d="M0 22L22 0H528L550 22V303L528 325H22L0 303Z"/>
    <path d="M0 22L22 0H40V325H22L0 303Z" fill="#d92c22" stroke="#0b0d10" stroke-width="3"/>
    <path d="M510 0H528L550 22V303L528 325H510Z" fill="#edb80e" stroke="#0b0d10" stroke-width="3"/>
    <rect class="panel" x="47" y="45" width="456" height="235" rx="5"/>
    <path class="edge" d="M47 45H503"/>
    <rect x="66" y="322" width="110" height="9" rx="3" fill="#090b0d"/>
    <rect x="374" y="322" width="110" height="9" rx="3" fill="#090b0d"/>
    <text class="dim" x="275" y="352" text-anchor="middle">330 × 195 mm</text>
  </g>

  <!-- Front end. -->
  <g transform="translate(270 535)">
    <text class="label" x="129" y="-20" text-anchor="middle">FRONT</text>
    <path d="M0 26L26 0H232L258 26V299L232 325H26L0 299Z" fill="#edb80e" stroke="#0b0d10" stroke-width="4"/>
    <path class="panel" d="M14 34L40 14H218L244 34V291L218 311H40L14 291Z"/>
    <circle class="detail" cx="78" cy="82" r="17"/><circle cx="78" cy="82" r="7" fill="#2580ff"/>
    <rect class="detail" x="54" y="126" width="49" height="18" rx="3"/>
    <rect class="detail" x="63" y="162" width="31" height="13" rx="6"/>
    <g stroke="#07090b" stroke-width="7" stroke-linecap="round">
      <path d="M55 220h48"/><path d="M55 241h48"/><path d="M55 262h48"/>
    </g>
    <rect x="126" y="43" width="92" height="242" rx="5" fill="#111419" stroke="#343a42" stroke-width="2"/>
    <text class="dim" x="129" y="348" text-anchor="middle">155 × 195 mm</text>
  </g>

  <!-- Rear end with flush replaceable service zones. -->
  <g transform="translate(870 535)">
    <text class="label" x="129" y="-20" text-anchor="middle">REAR</text>
    <path d="M0 26L26 0H232L258 26V299L232 325H26L0 299Z" fill="#d92c22" stroke="#0b0d10" stroke-width="4"/>
    <path class="panel" d="M14 34L40 14H218L244 34V291L218 311H40L14 291Z"/>
    <rect class="detail" x="31" y="48" width="196" height="76" rx="3"/>
    <rect class="detail" x="35" y="159" width="188" height="77" rx="3"/>
    <rect x="43" y="171" width="130" height="53" fill="url(#hex)" stroke="#555d67" stroke-width="2"/>
    <rect x="183" y="177" width="28" height="40" rx="2" fill="#080a0d" stroke="#737b86" stroke-width="2"/>
    <path class="edge" d="M34 268H224"/>
    <text class="dim" x="129" y="348" text-anchor="middle">155 × 195 mm</text>
  </g>
</svg>

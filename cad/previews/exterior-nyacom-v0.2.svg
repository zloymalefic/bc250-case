    <path class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M91 80V762"/>
    <text class="dim" x="76" y="430" transform="rotate(-90 76 430)" text-anchor="middle">374 мм с основанием</text>
    <path class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M105 872H489"/>
    <text class="dim" x="297" y="895" text-anchor="middle">225 мм</text>
    <text class="dim" x="297" y="925" text-anchor="middle">опорная площадь 185 × 225 мм</text>
  </g>


    <rect x="28" y="82" width="314" height="381" rx="4" fill="url(#mesh)" stroke="#59626d" stroke-width="2"/>
    <rect class="cooler" x="67" y="111" width="236" height="326" rx="6" opacity=".45"/>
    <circle cx="185" cy="202" r="73" fill="none" stroke="#8c96a1" stroke-width="3" opacity=".7"/>
    <circle cx="185" cy="350" r="73" fill="none" stroke="#8c96a1" stroke-width="3" opacity=".7"/>
    <path class="base" d="M-15 525H385V591H-15Z"/>
    <rect x="17" y="542" width="336" height="29" fill="#0f1216" stroke="#59626d" stroke-width="2"/>
    <text class="dim" x="185" y="617" text-anchor="middle">195 × 330 мм · основание +44 мм</text>
  </g>

  <g transform="translate(1170 120)">

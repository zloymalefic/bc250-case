    <circle cx="205" cy="119" r="13" fill="#101419" stroke="#6e7782" stroke-width="2"/>
    <path d="M205 110v9m-6-5a9 9 0 1 0 12 0" fill="none" stroke="#3692ff" stroke-width="2"/>
    <rect x="236" y="109" width="34" height="12" rx="2" fill="#090b0e"/>
    <rect x="278" y="107" width="24" height="16" rx="7" fill="#090b0e"/>
    <path class="cable" d="M300 748v42q0 20 23 20h86"/>
    <path class="cable" d="M340 748v28q0 20-23 20h-88"/>

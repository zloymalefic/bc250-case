<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#f4f6f8}.sub{font:15px system-ui,sans-serif;fill:#aab1bb}
      .h{font:700 18px system-ui,sans-serif;fill:#f4f6f8}.label{font:700 15px system-ui,sans-serif;fill:#dce1e7}
      .dim{font:14px system-ui,sans-serif;fill:#9da6b1}.note{font:13px system-ui,sans-serif;fill:#c0c6ce}
      .body{fill:#22272e;stroke:#07090b;stroke-width:3}.face{fill:#171b20;stroke:#4a525c;stroke-width:2}
      .front{fill:#d6a619;stroke:#080a0c;stroke-width:3}.rear{fill:#b93730;stroke:#080a0c;stroke-width:3}
      .base{fill:#343b44;stroke:#0a0c0f;stroke-width:3}.edge{fill:none;stroke:#3692ff;stroke-width:3}
      .hidden{fill:none;stroke:#737d89;stroke-width:1.4;stroke-dasharray:6 5}.measure{stroke:#7e8996;stroke-width:1.2}
      .pcb{fill:#267a50;stroke:#4daf79;stroke-width:2}.cooler{fill:#66717d;stroke:#aab3bc;stroke-width:2}
      .psu{fill:#725431;stroke:#bd8a4d;stroke-width:2}.cable{fill:none;stroke:#69aaff;stroke-width:5;stroke-linecap:round}
    </style>
    <pattern id="mesh" width="12" height="10" patternUnits="userSpaceOnUse">
      <path d="M3 1h6l3 4-3 4H3L0 5z" fill="none" stroke="#59626d" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#7e8996"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#101318"/>

    <path d="M56 53v9m-6-5a9 9 0 1 0 12 0" fill="none" stroke="#3692ff" stroke-width="2"/>
    <rect x="39" y="92" width="39" height="13" rx="2" fill="#080a0d"/>
    <rect x="45" y="119" width="27" height="11" rx="5" fill="#080a0d"/>
    <rect x="96" y="34" width="58" height="166" fill="url(#mesh)"/>
    <text class="dim" x="93" y="258" text-anchor="middle">155 × 195</text>
  </g>

  <g transform="translate(960 790)">
    <text class="h" x="93" y="0">ЗАД — ОБЩАЯ ВСТАВКА</text>
    <path class="rear" d="M0 18L18 0H168L186 18V216L168 234H18L0 216Z"/>
    <path class="face" d="M12 26L30 12H156L174 26V208L156 222H30L12 208Z"/>
    <rect x="30" y="34" width="126" height="74" rx="4" fill="#0a0c10" stroke="#6b7480" stroke-width="2"/>
    <rect x="30" y="126" width="126" height="72" rx="4" fill="#0a0c10" stroke="#6b7480" stroke-width="2"/>
    <text class="note" x="93" y="78" text-anchor="middle">BC-250 I/O</text>
    <text class="note" x="93" y="169" text-anchor="middle">PSU cassette</text>
    <text class="dim" x="93" y="258" text-anchor="middle">кассета 125 × 165</text>
  </g>

  <g transform="translate(1210 790)">
    <text class="h" x="155" y="0">ГОРИЗОНТАЛЬНО</text>
    <path class="body" d="M0 17L17 0H293L310 17V160L293 177H17L0 160Z"/>
    <path class="front" d="M0 17L17 0H30V177H17L0 160Z"/>
    <path class="rear" d="M292 0H293L310 17V160L293 177H292Z"/>
    <rect x="35" y="25" width="252" height="127" rx="4" fill="url(#mesh)"/>
    <rect x="38" y="174" width="62" height="8" rx="3" fill="#06080a"/>
    <rect x="210" y="174" width="62" height="8" rx="3" fill="#06080a"/>
    <text class="note" x="155" y="205" text-anchor="middle">обычная задняя крышка, глубина 6 мм</text>
    <text class="dim" x="155" y="230" text-anchor="middle">330 × 155 × 195 мм</text>
  </g>

  <text class="sub" x="48" y="1068">Архитектура и пропорции зафиксированы; отверстия I/O, PSU и форма опор уточняются после измерения реальных разъёмов и fit-check крепления кулера.</text>
</svg>

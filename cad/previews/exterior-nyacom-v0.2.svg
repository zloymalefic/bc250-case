    <path class="body" d="M0 24L24 0H286L310 24V501L286 525H24L0 501Z"/>
    <path class="front" d="M0 24L24 0H286L310 24V58H0Z"/>
    <rect class="pcb" x="78" y="72" width="8" height="421"/>
    <rect class="cooler" x="91" y="111" width="171" height="326" rx="5" opacity=".8"/>
    <rect class="psu" x="17" y="164" width="54" height="324" rx="4"/>
    <text class="note" x="96" y="96">JF13K</text>
    <text class="note" x="26" y="188" transform="rotate(90 26 188)">CISCO PSU</text>
    <text class="note" x="73" y="505">BC-250 вертикально</text>
    <path class="base" d="M-15 525H325V591H-15Z"/>
    <rect x="15" y="542" width="280" height="29" fill="#0f1216" stroke="#59626d" stroke-width="2"/>
    <text class="dim" x="155" y="617" text-anchor="middle">155 × 330 мм · основание +44 мм</text>
  </g>

  <g transform="translate(720 790)">
    <text class="h" x="93" y="0">ПЕРЕД</text>
    <path class="front" d="M0 18L18 0H168L186 18V216L168 234H18L0 216Z"/>
    <path class="face" d="M12 26L30 12H156L174 26V208L156 222H30L12 208Z"/>

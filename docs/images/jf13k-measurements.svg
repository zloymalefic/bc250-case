<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title{font:700 29px system-ui,sans-serif;fill:#20242a}.head{font:700 22px system-ui,sans-serif;fill:#20242a}
      .txt{font:16px system-ui,sans-serif;fill:#4f5863}.code{font:700 24px system-ui,sans-serif;fill:#1769c2}
      .pcb{fill:#39845d;stroke:#175237;stroke-width:4}.cooler{fill:#727d88;stroke:#313941;stroke-width:4}
      .fan{fill:none;stroke:#aeb6be;stroke-width:4}.line{fill:none;stroke:#1769c2;stroke-width:4}
      .paper{fill:#fff;stroke:#aab1b9;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9z" fill="#1769c2"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#f4f5f6"/>
  <text class="title" x="45" y="50">BC-250 + JF13K: семь простых измерений</text>

  <g transform="translate(45 105)">
    <text class="head" x="300" y="0" text-anchor="middle">1. Вид строго сверху</text>
    <rect class="pcb" x="90" y="70" width="500" height="260" rx="4"/>
    <rect class="cooler" x="145" y="35" width="390" height="330" rx="12"/>
    <circle class="fan" cx="265" cy="200" r="100"/><circle class="fan" cx="415" cy="200" r="100"/>
    <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M90 390H145"/>
    <text class="code" x="117" y="425" text-anchor="middle">A</text>
    <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M535 390H590"/>
    <text class="code" x="562" y="425" text-anchor="middle">B</text>
    <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M625 35V70"/>
    <text class="code" x="650" y="61">C</text>
    <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M625 330V365"/>
    <text class="code" x="650" y="355">D</text>
    <text class="txt" x="90" y="470">Меряем от зелёного края платы</text>
    <text class="txt" x="90" y="494">до серого металлического радиатора.</text>
  </g>

  <g transform="translate(760 105)">
    <text class="head" x="285" y="0" text-anchor="middle">2. Вид сбоку</text>
    <rect class="pcb" x="65" y="330" width="500" height="12"/>
    <path class="cooler" d="M145 95H500V295H145Z"/>
    <rect class="paper" x="115" y="70" width="420" height="18"/>
    <text class="txt" x="325" y="60" text-anchor="middle">ровная линейка или книжка</text>
    <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M95 88V330"/>
    <text class="code" x="72" y="220" text-anchor="middle">E</text>
    <text class="txt" x="135" y="390">E - высота от платы до верха кулера.</text>
    <rect x="250" y="342" width="120" height="38" rx="8" fill="#4d555e"/>
    <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M405 342V380"/>
    <text class="code" x="430" y="370">F</text>
    <text class="txt" x="135" y="420">F - самая выступающая деталь сзади.</text>
    <rect x="485" y="270" width="75" height="42" rx="5" fill="#20242a"/>
    <path d="M560 291h70q28 0 28 28v24" fill="none" stroke="#d38628" stroke-width="9"/>
    <path class="line" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M500 250V270"/>
    <text class="code" x="520" y="250">G</text>
    <text class="txt" x="135" y="450">G - самый маленький зазор до штекера.</text>
  </g>

  <g transform="translate(55 680)">
    <rect x="0" y="0" width="1290" height="155" rx="14" fill="#e8edf3" stroke="#c3cad2" stroke-width="2"/>
    <text class="head" x="25" y="40">Важно</text>
    <text class="txt" x="25" y="72">• Ничего не разбирайте и не нажимайте на вентиляторы.</text>
    <text class="txt" x="25" y="101">• Если радиатор выступает за плату, напишите «выступает на … мм».</text>
    <text class="txt" x="25" y="130">• Если измерить не получается - сфотографируйте место сбоку вместе с линейкой.</text>
  </g>
</svg>
